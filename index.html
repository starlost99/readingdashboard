  return `<a class=drop href="${esc(f.url)}" target=_blank rel=noopener><div class=t>${f.rank?'#'+f.rank+' ':''}${esc(f.title)}</div><div class=m><span class=b style="color:${ac}">${stt}</span>${f.ud&&!(f.md&&stt==='usual '+f.ud)?`<span class=b style="margin-left:6px">${f.ud}s</span>`:''}</div><div style="display:flex;align-items:center;gap:7px;margin-top:5px"><div class=bar style="flex:1;height:4px;margin:0"><i style="width:${pc}%"></i></div><span class=sv>day ${f.dsl} of ~${f.gap}</span></div></a>`}).join('');
 if(od.length)h+=dt('mbod',`<span style="color:${ac}">Still waiting on · ${od.length}</span>`,od.map(f=>`<div class=sr style="display:flex;justify-content:space-between;gap:8px"><a href="${esc(f.url)}" target=_blank rel=noopener>${f.rank?'#'+f.rank+' ':''}${esc(f.title)}</a><b style="color:${ac};font-size:10px;white-space:nowrap">${Math.abs(f.du)}d late</b></div>`).join(''));
 // glance
 let nt=null;for(let d=1;d<=c.cl;d++){const pk=phd(c.day+d,c);if(pk!==c.ph){nt={d,ph:pk};break}}
 const runs=[];for(let i=1;i<=c.cl;i++){const pk=phd(i,c),l=runs[runs.length-1];l&&l[0]===pk?l[1]++:runs.push([pk,1])};
 h+=`<div class=lbl style="color:${ac};opacity:.9">Cycle at a glance</div><div class=pb>${runs.map(([pk,n])=>`<i style="flex:${n};background:${PC[pk]}"></i>`).join('')}<u style="left:${Math.min(100,(c.day-.5)/c.cl*100)}%"></u></div>`
  +`<div class=cg>${[[fd(c.next),'Next period'],[nt?nt.d+'d':'—',nt?'Until '+PH[nt.ph][1]:'Next phase'],[c.cl+'d','Avg. cycle']].map(([v,l])=>`<div style="background:${rgba(ac,.08)};border-color:${rgba(ac,.22)}"><b style="font-size:15px">${v}</b><small>${l}</small></div>`).join('')}</div>`
  +`<div class=strip>${[0,1,2,3,4,5,6].map(d=>{const pk=phd(c.day+d,c),dd=new Date(addD(t,d)+'T12:00');return `<div style="background:${rgba(PC[pk],.1)};border:1px solid ${rgba(PC[pk],.3)};color:${PC[pk]}">${d?dd.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2):'today'}<span>${PH[pk][0]}</span></div>`}).join('')}</div>`;
 const lt=pastLetters(c);
 h+=dt('mbl',`<span style="color:${ac}">💌 Letters from past cycles${lt.length?' · '+lt.length:''}</span>`,lt.length?lt.map(l=>`<div class=sr><b style="color:${ac}">${fd(l.date)} · ${l.ago} cycle${l.ago>1?'s':''} ago</b><small style="white-space:pre-wrap;opacity:.9;font-size:12.5px">${esc(l.text)}</small></div>`).join(''):'<p class=empty style="margin:0">Nothing written on this cycle day yet.</p>');
 return h}
function mbBox(){return dt('mb','☀️ Morning brief',mbView())}
OPEN.mb=true;
function drawBrief(){const el=$('#mbv');if(el)el.innerHTML=mbBox()}

async function load(){const {data,error}=await sb.from('ao3_sync').select('key,value,updated_at');
 if(error)msg=error.message;else{rows={};data.forEach(r=>rows[r.key]=r);}draw();}
async function persist(key,value){const r=rows[key];let res;
 if(r)res=await sb.from('ao3_sync').update({value,device:'web'}).eq('key',key).eq('updated_at',r.updated_at).select('updated_at');
 else res=await sb.from('ao3_sync').insert({key,value,device:'web'}).select('updated_at');
 if(res.error)throw res.error;
 if(!res.data.length){await load();throw new Error('That data changed somewhere else, so I reloaded it. Please try again.');}
 rows[key]={key,value,updated_at:res.data[0].updated_at};}
async function commit(t,a){try{await persist(K[t],a);
 if(t==='log')await persist(TOT,a.reduce((s,x)=>s+(x.words||0),0));
 msg='Saved. Your AO3 pages pick it up the next time they load.';}catch(e){msg=e.message;}
 $('#dlg').close();draw();}

function filtered(){const L=arr('log').map((x,i)=>({x,i,k:dk(x.date)})).sort((a,b)=>b.x.date.localeCompare(a.x.date));
 return L.filter(({k})=>F.all?true:F.d?k===F.d:(F.s||F.e)?(!F.s||k>=F.s)&&(!F.e||k<=F.e):k.startsWith(F.m));}
function stats(){const L=arr('log'),t=today(),m=F.m,live=!F.all&&!F.d&&!F.s&&!F.e&&m===t.slice(0,7);
 const by={};L.forEach(x=>{const k=dk(x.date).slice(0,7);by[k]=(by[k]||0)+(x.words||0)});
 const best=Math.max(0,...Object.entries(by).filter(([k])=>k<t.slice(0,7)).map(e=>e[1]));
 const beat=best>GOAL,target=beat?best+1:GOAL,mw=by[m]||0,pct=Math.min(100,mw/target*100);
 let h=`<div class=lbl>${live?"This month's":m} progress</div><div class=bar><i style="width:${pct.toFixed(1)}%"></i></div>`+row(`${fmt(mw)} / ${fmt(target)} words · ${pct.toFixed(0)}%`,rt(mw)+(live?' logged':'')+(beat?'  ·  goal: beat best month':''));
 if(live){const [y,mo]=m.split('-').map(Number),dim=new Date(y,mo,0).getDate(),day=+t.slice(8),hr=+new Date().toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit'}),el=Math.min(1,(day-1+hr/24)/dim),diff=mw-target*el,tw=L.filter(x=>dk(x.date)===t).reduce((s,x)=>s+x.words,0),left=Math.max(0,target-mw),dl=dim-day+1;
  const d=`${pct.toFixed(0)}% done · ${(el*100).toFixed(0)}% of month elapsed`;
  h+=Math.abs(diff)<=target*.01?row('🎯 On track',d,'#a3be8c'):diff>0?row(`🚀 Ahead by ${fmt(Math.round(diff))} words (${rt(diff)})`,d,'#a3be8c'):row(`⏳ Behind by ${fmt(Math.round(-diff))} words (${rt(-diff)})`,d,'#ffb8dc');
  if(left>0){const per=Math.ceil(Math.max(0,target-(mw-tw))/dl);h+=row(`📖 ${fmt(per)} words/day to ${beat?'beat best month':'hit '+fmt(GOAL)}`,`${dl} day${dl>1?'s':''} left · ${rt(left)} total left`,'#ffb8dc');
   if(tw>0)h+=row(`✏️ ${fmt(Math.max(0,per-tw))} words left today`,`${fmt(tw)} logged already`,'#ffb8dc')}}
 const all=L.reduce((s,x)=>s+x.words,0),days=new Set(L.map(x=>dk(x.date))).size;
 h+=`<div class=lbl>All time</div>`+row(`${fmt(rows[TOT]?.value??all)} words`,`${rt(all)} of reading · ${books(all)}`)+row(`${days} reading days`,days?`${fmt(Math.round(all/days))} words/day on average`:'');
 return h;}
function heat(){const by={};arr('log').forEach(x=>{const k=dk(x.date);by[k]=(by[k]||0)+x.words});
 const end=new Date(today()+'T12:00:00'),W=22,start=new Date(end);start.setDate(end.getDate()-end.getDay()-(W-1)*7);
 const mx=Math.max(1,...Object.values(by));let c='';
 for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const k=d.toLocaleDateString('sv'),v=by[k]||0;c+=`<i title="${k}: ${fmt(v)} words" style="${v?`background:rgba(255,158,207,${(.2+.8*Math.sqrt(v/mx)).toFixed(2)})`:''}"></i>`}
 return `<div class=hm>${c}</div><div class=legend>Last ${W} weeks · darker pink = more words</div>`;}

function readView(){const L=filtered(),tw=L.reduce((s,{x})=>s+x.words,0),now=today();
 const fil=`<div class=frow><span>Month</span><input type=month id=fm value="${esc(F.m)}"></div><div class=frow><span>Specific date</span><input type=date id=fd value="${esc(F.d)}"></div><div class=frow><span>Date range</span><input type=date id=fs value="${esc(F.s)}"> → <input type=date id=fe value="${esc(F.e)}"></div><div class=frow><button data-a=fclear>Show all</button><button data-a=fnow>This month</button></div>`;
 return det('Filters',fil)+det('Statistics',stats(),true)+det('Reading heatmap',heat())+
 `<div class=tot><span><b>Filtered total:</b> ${fmt(tw)} words</span><span><b>Est. reading time:</b> ${rt(tw)}</span><span><b>Books equivalent:</b> ${books(tw)}</span></div><div class=bar2><span></span><button class=pri data-a=add data-t=log>Add entry</button></div>`+
 (L.slice(0,more).map(({x,i})=>`<div class=row><div>${logRow(x)}</div><button data-a=edit data-t=log data-i=${i}>Edit</button></div>`).join('')+(L.length>more?'<button data-a=more>Show more</button>':'')||'<p class=empty>No entries found.</p>');}
function listItems(){let it=arr(tab).map((x,i)=>({x,i}));
 if(tab==='fics'){const s=q.toLowerCase(),R=rows[STAR]?.value||{};it=it.filter(({x})=>(!s||(x.title+' '+(x.aka||'')+' '+(x.fandoms||[]).join(' ')).toLowerCase().includes(s))&&(flt==='all'||st(x)===flt));it.forEach(o=>o.r=R[o.x.workId])}
 else{const d=x=>x.date||x.start||'';it.sort((a,b)=>d(b.x).localeCompare(d(a.x)));}
 return it.slice(0,more).map(({x,i,r})=>`<div class=row><div>${V[tab](x)}${r?`<div class=m><span class=st>${stars(r)}</span></div>`:''}</div><button data-a=edit data-t=${tab} data-i=${i}>Edit</button></div>`).join('')+(it.length>more?'<button data-a=more>Show more</button>':'')||'<p class=empty>Nothing here yet.</p>';}
function listView(){return `<div class=bar2>${tab==='fics'?`<input id=q placeholder="Search title or fandom" value="${esc(q)}"><select id=f>${['all','reading','caught up','finished'].map(o=>`<option ${o===flt?'selected':''}>${o}</option>`).join('')}</select>`:'<span style="flex:1"></span>'}<button class=pri data-a=add data-t=${tab}>Add</button></div><div id=list>${listItems()}</div>`;}
function rawView(){return `<p class=m>Every synced key. Edit carefully, this is the raw JSON.</p><label>Import a backup file (replaces matching data)<input type=file id=imp accept=".json"></label><div id=list>`+Object.values(rows).sort((a,b)=>a.key.localeCompare(b.key)).map(r=>`<div class=row><div><b>${esc(r.key)}</b><div class=m>${sp(Math.round(JSON.stringify(r.value).length/1024)+' KB','updated '+r.updated_at.slice(0,16).replace('T',' '))}</div></div><button data-a=raw data-k="${esc(r.key)}">Edit</button></div>`).join('')+'</div>';}
function draw(){const el=$('#app');
 if(!session){el.innerHTML=`<form id=login class=login><h1>Reading Dashboard</h1>${msg?`<p class=msg>${esc(msg)}</p>`:''}<label>Email<input name=email type=email required></label><label>Password<input name=pw type=password required></label><button class=pri>Sign in</button></form>`;return;}
 if(!F.m)F.m=today().slice(0,7);
 const T=[['log','Today'],['read','Reading'],['fics','Fics'],['mood','Mood'],['period','Period'],['raw','Raw data']];
 el.innerHTML=`<div class=modal><div class=top><div><b>Reading Dashboard</b><span class=h>♡</span></div><div><button data-a=refresh>Refresh</button> <button data-a=out>Sign out</button></div></div><div class=body><nav class=tabs>${T.map(([k,l])=>`<button class=tab data-a=tab data-t=${k} aria-selected=${tab===k}>${l}</button>`).join('')}</nav>${msg?`<p class=msg>${esc(msg)}</p>`:''}${tab==='log'?'<div id=mbv>'+mbBox()+'</div><div id=logv>'+logView()+'</div><div id=calv>'+calBox()+'</div><div id=logl>'+letterView()+'</div>':tab==='raw'?rawView():tab==='read'?readView():tab==='period'?periodView():listView()}</div></div>`;}

function edit(t,i){cur={t,i};const o=i<0?{}:arr(t)[i]||{};
 $('#dlg form').innerHTML=`<h2>${i<0?'Add':'Edit'}</h2>`+S[t].map(([n,l,ty])=>`<label>${l}`+(ty==='check'?`<input type=checkbox name=${n} ${o[n]?'checked':''}>`:`<input name=${n} type=${ty==='list'?'text':ty} value="${esc(ty==='list'?(o[n]||[]).join(', '):ty==='date'?String(o[n]??'').slice(0,10):o[n])}">`)+'</label>').join('')
  +`<div class=btns><button class=pri>Save</button>${i<0?'':'<button type=button class=danger data-a=del>Delete</button>'}<button type=button data-a=close>Cancel</button></div>`;
 $('#dlg').showModal();}
function editRaw(k){cur={raw:k};$('#dlg form').innerHTML=`<h2>${esc(k)}</h2><textarea name=j rows=16>${esc(JSON.stringify(rows[k].value,null,1))}</textarea><div class=btns><button class=pri>Save</button><button type=button data-a=close>Cancel</button></div>`;$('#dlg').showModal();}
async function save(form){const fd=new FormData(form);
 if(cur.raw){try{await persist(cur.raw,JSON.parse(fd.get('j')));msg='Saved.';}catch(e){msg=e.message;}$('#dlg').close();return draw();}
 const {t,i}=cur,a=arr(t).slice(),o=i<0?{}:{...a[i]};
 S[t].forEach(([n,l,ty])=>{const v=fd.get(n);
  if(ty==='check')o[n]=v!==null;else if(ty==='number')o[n]=v===''?undefined:+v;
  else if(ty==='list')o[n]=v.split(',').map(s=>s.trim()).filter(Boolean);
  else if(ty==='date'){const old=String(o[n]??'');o[n]=v===old.slice(0,10)?old:(t==='log'&&v?new Date(v+'T12:00:00').toISOString():v);}
  else o[n]=v;});
 if(i<0){if(t==='log'){o.id=crypto.randomUUID();o.key='manual::'+o.id;if(!o.date)o.date=new Date().toISOString();}
  if(t==='period')o.id='p_'+Date.now();
  if(t==='fics'){if(!o.workId){alert('A work ID is needed (the number in the fic link).');return;}o.url='https://archiveofourown.org/works/'+o.workId;o.trackedAt=new Date().toISOString();o.fandoms=[];}
  a.push(o);}else a[i]=o;
 if(t==='mood'){const j=a.findIndex((x,k)=>x.date===o.date&&x!==o);if(j>=0)a.splice(j,1);}
 commit(t,a);}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a.startsWith('lg-'))return logAct(b);
 if(a==='cal-p'||a==='cal-n'){const[y,m]=CALM.split('-').map(Number),x=new Date(y,m-1+(a==='cal-n'?1:-1),1);CALM=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');return drawCal()}
 if(a==='cal-d'){const d=b.dataset.d;CSEL=CSEL===d?null:d;if(CSEL&&d<=today()){LD=d;WK=null;drawLetter();return drawLog()}return drawCal()}
 if(a==='cal-l'){const el=$('#logv');return el&&el.scrollIntoView({behavior:'smooth'})}
 if(a==='per-end'){const x=arr('period').map(o=>({...o})),i=+b.dataset.i;x[i].end=today();return commit('period',x)}
 if(a==='tab'){tab=b.dataset.t;more=80;msg='';draw();}
 else if(a==='edit')edit(b.dataset.t,+b.dataset.i);else if(a==='add')edit(b.dataset.t,-1);
 else if(a==='raw')editRaw(b.dataset.k);else if(a==='more'){more+=80;draw();}
 else if(a==='close')$('#dlg').close();
 else if(a==='fclear'){F={m:F.m,d:'',s:'',e:'',all:true};draw();}
 else if(a==='fnow'){F={m:today().slice(0,7),d:'',s:'',e:'',all:false};draw();}
 else if(a==='del'){if(confirm('Delete this entry?')){const x=arr(cur.t).slice();x.splice(cur.i,1);commit(cur.t,x);}}
 else if(a==='refresh'){msg='Refreshed.';await load();}
 else if(a==='out'){await sb.auth.signOut();session=null;rows={};draw();}});
document.addEventListener('input',e=>{if(e.target.id==='lgl'){clearTimeout(LT);const v=e.target.value,d=LD;$('#lgls').textContent='saving…';LT=setTimeout(()=>saveLetter(d,v),700);return}
 if(e.target.id==='q'){q=e.target.value;more=80;$('#list').innerHTML=listItems();}});
document.addEventListener('change',async e=>{const id=e.target.id,v=e.target.value;
 if(id==='lgd'){LD=v||today();WK=null;drawLetter();return drawLog();}if(id==='lgh')return setMood(LD,{sleepHours:v?+v:undefined});
 if(id==='f'){flt=v;$('#list').innerHTML=listItems();}
 if(['fm','fd','fs','fe'].includes(id)){if(id==='fm'){F.m=v||today().slice(0,7);F.d=F.s=F.e='';}else if(id==='fd'){F.d=v;}else F[id==='fs'?'s':'e']=v;F.all=false;more=80;
  const open=[...document.querySelectorAll('details')].map(d=>d.open);draw();document.querySelectorAll('details').forEach((d,i)=>d.open=i===0?true:open[i]);}
 if(id==='imp'&&e.target.files[0]&&confirm('Import this backup? It replaces the matching data in the cloud.')){
  try{const j=JSON.parse(await e.target.files[0].text());for(const [k,key] of Object.entries(MAP))if(j[k]!==undefined){const ex=Array.isArray(rows[key]?.value)?rows[key].value:[];await persist(key,k==='letters'&&Array.isArray(j[k])?[...ex,...j[k].filter(l=>l&&!ex.some(x=>x.date===l.date))]:j[k]);}msg='Backup imported.';}catch(x){msg=x.message;}await load();}});
document.addEventListener('submit',async e=>{e.preventDefault();
 if(e.target.id==='login'){const f=new FormData(e.target);const {data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('pw')});
  if(error){msg=error.message;return draw();}msg='';session=data.session;load();}
 else save(e.target);});
sb.auth.getSession().then(({data})=>{session=data.session;session?load():draw();});
</script></body></html>
